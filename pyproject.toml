[project]
name = "fluxcity"
version = "0.0.1"
description = "SUMO-based traffic simulation, scenario and optimization platform"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "eclipse-sumo==1.28.0",
  "libsumo==1.28.0",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pyarrow>=17",
  "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/fluxcity"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]
extend-exclude = ["discovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 bans print()

[tool.mypy]
python_version = "3.12"
packages = ["fluxcity"]
mypy_path = "backend"
strict = true
