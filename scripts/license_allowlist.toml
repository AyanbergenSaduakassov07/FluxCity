# ADR-014 license gate. SPDX ids allowed for runtime + dev dependencies.
allowed = [
  "MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "ISC", "PSF-2.0", "Python-2.0",
  "MPL-2.0", "EPL-2.0", "Unlicense", "0BSD", "Zlib", "CC0-1.0", "MIT-CMU",
]

# Trove classifier / free-text License field -> SPDX id.
[aliases]
"MIT License" = "MIT"
"BSD License" = "BSD-3-Clause"
"Apache Software License" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"ISC License (ISCL)" = "ISC"
"Python Software Foundation License" = "PSF-2.0"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"Eclipse Public License 2.0 (EPL-2.0)" = "EPL-2.0"
"The Unlicense (Unlicense)" = "Unlicense"
"zlib/libpng License" = "Zlib"

# Package -> SPDX expression, for packages with missing or wrong metadata. Verify before adding.
[overrides]

# LGPL only by explicit, reviewed exception (dynamic linking only).
[lgpl_exceptions]
