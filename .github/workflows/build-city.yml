# Manual city network build off the laptop: downloads the Geofabrik extract, clips, netconvert,
# side outputs, then uploads the network and GeoJSON as an artifact (heavy compute stays in CI).
name: build-city
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Network profile in sim/network/build_city.py PROFILES"
        type: choice
        options: ["astana", "v2", "v1"]
        default: "astana"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for the eclipse-sumo Linux binaries, and osmium-tool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libatomic1 libx11-6 libxext6 libxrender1 libgl1 osmium-tool
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Build the network
        run: uv run python -m sim.network.build_city --network-profile "${{ inputs.profile }}"
      - name: Upload network, side outputs and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: city-${{ inputs.profile }}
          path: |
            data/${{ inputs.profile == 'astana' && 'astana' || 'jeddah' }}/
            web/public/data/
            logs/
          if-no-files-found: ignore
          retention-days: 14
